 <title id="figure-title">Conceptual overlap denominator coordinates</title>
 <desc id="figure-description">One-dimensional slice at axial bin zero. Set object frequency K=0.6, carrier k0=1.2, R=1, all in cycles per micrometre. Other signed orders n=0,+1,-1 sample q=0.6,-0.6,1.8 respectively; only the first two are radially eligible. This illustrates other-order eligibility, not the self term, actual transfer values, or exact boundary behavior.</desc>
