 <title id="figure-title">Conceptual native and relocated frequency support</title>
 <desc id="figure-description">Toy envelopes max(1-abs(k)/R,0), R=1 cycle per micrometre, carrier=1.2 cycles per micrometre. Native envelopes coincide; signed object-coordinate envelopes are centered at -1.2, 0, +1.2. These are illustrative profiles, not measured OTFs, transfer phases, amplitudes, or recovery evidence.</desc>
