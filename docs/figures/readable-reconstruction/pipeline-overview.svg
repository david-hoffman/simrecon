   <g id="text_1">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(100.024987 71.976562)">Declared specimen exposures</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(122.2578 85.413938)">T × D × P × Z × Y × X</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(104.999362 144.961875)">1  Prepare acquisition bands</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(85.2603 158.39925)">correct → edges/equalize → Fourier</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(77.2878 171.836625)">phase separation → axial Fourier (3D)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(119.41155 248.880562)">2  Estimate parameters</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(59.192175 262.317937)">carrier vectors k and complex modulation a</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(115.0203 339.361875)">3  Reconstruct each time</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(80.688112 352.79925)">native filtering → Fourier embedding</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(81.9603 366.236625)">inverse sum + positive carrier ramp</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(441.32025 147.792563)">Explicit complex OTF H</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(425.53275 161.229938)">or separate bead calibration</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(450.61275 339.195)">Known parameters?</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(440.664937 352.632375)">Call reconstruct_known</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #253447" transform="translate(447.838687 366.4035)">to bypass estimation</text>
   </g>
