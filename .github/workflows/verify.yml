            --output "$reader_tmp" "$reader_url")
          "$(uv python find 3.13.12)" - "$reader_sha256" "$reader_size" "${curl_command[@]}" <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
