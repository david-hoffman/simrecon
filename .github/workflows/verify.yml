name: Verify
'on':
  pull_request: null
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  EXPECTED_SHA: ${{ github.sha }}
jobs:
  prepare:
    name: Prepare verification
    runs-on: ubuntu-24.04
    outputs:
      ci_uuid: ${{ steps.identity.outputs.ci_uuid }}
    steps:
      - name: Check out exact event candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: 0.12.19
      - name: Install pinned Python
        run: |
          uv python install 3.13.12
      - name: Install pinned development-reader Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 21.0.7+6.0.LTS
      - name: Record clean source identity before participating phases
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci
          "$(uv python find 3.13.12)" - <<'PYCODE'
          import json
          import os
          from pathlib import Path
          from scripts import verify

          before = verify.identity()
          if before['commit'] != os.environ['EXPECTED_SHA'] or before['dirty'] or before['untracked']:
              raise SystemExit('Expected clean exact event candidate')
          # The existing manifest already fingerprints every tracked configuration/source.
          with Path('artifacts/ci/source-identity.json').open('x') as stream:
              json.dump({'before': before, 'inputs': {}, 'problems': []}, stream, indent=2)
              stream.write('\n')
          PYCODE
      - name: Create fresh common UUID and immutable initial timing bytes
        id: identity
        run: |
          set -euo pipefail
          "$(uv python find 3.13.12)" -c 'import uuid; print("ci_uuid=" + str(uuid.uuid4()))' >> "$GITHUB_OUTPUT"
          set -o noclobber
          cat .github/pytest-durations.json > artifacts/ci/durations.json
      - name: Bootstrap the pinned Bio-Formats bytes from the official release
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci artifacts/imagej-reader
          reader_tmp="$(mktemp -- artifacts/imagej-reader/.bioformats-bootstrap.XXXXXXXXXX)"
          trap 'rm -f -- "$reader_tmp"' EXIT
          reader_url='https://github.com/ome/bioformats/releases/download/v8.5.0/bioformats_package.jar'
          reader_sha256='c6e60665d53a334b66e4d635340151f403dfe57a64704c573dd4c03b873befb9'
          reader_size=53843906
          curl_command=(/usr/bin/curl -q --fail --silent --show-error --location
            --max-redirs 3 --proto '=https' --proto-redir '=https'
            --connect-timeout 15 --max-time 180 --max-filesize 70000000 --retry 0
            --write-out 'http_code=%{http_code}\nnum_redirects=%{num_redirects}\nsize_download=%{size_download}\ntime_total=%{time_total}\nssl_verify_result=%{ssl_verify_result}\n'
            --output "$reader_tmp" "$reader_url")
          "$(uv python find 3.13.12)" - "$reader_sha256" "$reader_size" "${curl_command[@]}" <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys

          selected = Path(sys.argv[3]).absolute()
          stat = selected.stat()
          version = subprocess.run([str(selected), '-q', '--version'], check=True, text=True, capture_output=True).stdout
          record = {
              'acquisition_url': sys.argv[-1], 'expected_sha256': sys.argv[1],
              'expected_size_bytes': int(sys.argv[2]), 'command': sys.argv[3:],
              'curl_before': {'selected': str(selected), 'resolved': str(selected.resolve(strict=True)),
                              'device': stat.st_dev, 'inode': stat.st_ino, 'size_bytes': stat.st_size,
                              'sha256': hashlib.sha256(selected.read_bytes()).hexdigest(), 'version': version},
          }
          with Path('artifacts/ci/reader-bootstrap.json').open('x') as stream:
              json.dump(record, stream, indent=2)
              stream.write('\n')
          if tuple(map(int, version.splitlines()[0].split()[1].split('.'))) < (8, 4, 0):
              raise SystemExit('Reader bootstrap requires stock curl >= 8.4.0')
          PYCODE
          set +e
          "${curl_command[@]}" > artifacts/ci/reader-bootstrap-curl-metrics.txt 2> artifacts/ci/reader-bootstrap-curl-stderr.txt
          curl_status=$?
          set -e
          "$(uv python find 3.13.12)" - "$curl_status" "$reader_tmp" <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          import sys

          path = Path('artifacts/ci/reader-bootstrap.json')
          record = json.loads(path.read_text())
          selected = Path(record['command'][0]).absolute()
          stat = selected.stat()
          version = subprocess.run([str(selected), '-q', '--version'], check=True, text=True, capture_output=True).stdout
          record['curl_after'] = {'selected': str(selected), 'resolved': str(selected.resolve(strict=True)),
                                  'device': stat.st_dev, 'inode': stat.st_ino, 'size_bytes': stat.st_size,
                                  'sha256': hashlib.sha256(selected.read_bytes()).hexdigest(), 'version': version}
          record['curl_status'] = int(sys.argv[1])
          downloaded = Path(sys.argv[2])
          record['download'] = {'path': str(downloaded), 'size_bytes': downloaded.stat().st_size,
                                'sha256': hashlib.sha256(downloaded.read_bytes()).hexdigest()}
          record['curl_identity_unchanged'] = record['curl_after'] == record['curl_before']
          path.write_text(json.dumps(record, indent=2) + '\n')
          if not record['curl_identity_unchanged']:
              raise SystemExit('Reader bootstrap curl identity changed')
          PYCODE
          if (( curl_status != 0 )); then exit "$curl_status"; fi
          test "$(stat -c %s -- "$reader_tmp")" -eq "$reader_size"
          printf '%s  %s\n' "$reader_sha256" "$reader_tmp" | sha256sum --check --strict
          ln -T -- "$reader_tmp" artifacts/imagej-reader/bioformats_package.jar
      - name: Synchronize locked dependencies and genuine reader inputs
        run: |
          set -euo pipefail
          export SIMRECON_JAVA="$JAVA_HOME/bin/java"
          make sync 2>&1 | tee artifacts/ci/sync.log
      - name: Record actual platform, tools, packages and selected inputs
        run: |
          set -euo pipefail
          export SIMRECON_JAVA="$JAVA_HOME/bin/java"
          uv run --locked --no-sync python - <<'PYCODE'
          import importlib.metadata
          import json
          import os
          import platform
          import shutil
          import subprocess
          import sys
          from pathlib import Path
          from scripts import verify

          commands = {
              'uv': ['uv', '--version'], 'git': ['git', '--version'], 'make': ['make', '--version'],
              'ruff': ['.venv/bin/ruff', '--version'], 'pyright': ['.venv/bin/pyright', '--version'],
              'coverage': ['.venv/bin/coverage', '--version'], 'pytest': ['.venv/bin/pytest', '--version'],
              'java': [os.environ['SIMRECON_JAVA'], '-XshowSettings:properties', '-version'],
          }
          tools = {}
          for name, command in commands.items():
              result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=True)
              selected = Path(shutil.which(command[0]) or command[0]).absolute()
              tools[name] = {'selected': str(selected), 'resolved': str(selected.resolve()),
                             **verify.fingerprint(selected), 'command': command, 'output': result.stdout}
          packages = sorted((d.metadata['Name'], d.version, str(d.locate_file(''))) for d in importlib.metadata.distributions())
          record = {'platform': platform.platform(), 'python': {'executable': sys.executable,
                    'resolved': str(Path(sys.executable).resolve()), 'version': sys.version,
                    **verify.fingerprint(Path(sys.executable))}, 'tools': tools, 'packages': packages,
                    'environment': {k: os.environ[k] for k in ('SIMRECON_JAVA', 'JAVA_HOME',
                    'COVERAGE_FILE', 'COVERAGE_PROCESS_START', 'PYTEST_ADDOPTS', 'PYTHONPATH', 'UV_PYTHON') if k in os.environ}}
          Path('artifacts/ci/environment.json').write_text(json.dumps(record, indent=2) + '\n')
          # Existing final identity collector checks ignored participating inputs as well.
          path = Path('artifacts/ci/source-identity.json')
          observation = json.loads(path.read_text())
          inputs = [Path(sys.executable), *(Path(tool['selected']) for tool in tools.values()),
                    Path('artifacts/imagej-reader/inputs.json'), Path('artifacts/imagej-reader/bioformats_package.jar'),
                    Path('artifacts/imagej-reader/ij-1.54p.jar')]
          if Path('artifacts/ci/durations.json').is_file():
              inputs.append(Path('artifacts/ci/durations.json'))
          observation['inputs'].update({str(p): {'before': verify.fingerprint(p), 'after': None} for p in inputs})
          path.write_text(json.dumps(observation, indent=2) + '\n')
          PYCODE
      - name: Clean prepare coverage outputs
        run: |
          set -euo pipefail
          make coverage-clean 2>&1 | tee artifacts/ci/coverage-clean.log
      - name: Observe actual complete serial collection without changing items
        run: |
          set -euo pipefail
          export SIMRECON_JAVA="$JAVA_HOME/bin/java"
          cat > artifacts/ci/collection_observer.py <<'PYCODE'
          """Passive public collection observer; retains original Item.nodeid strings."""
          import json
          from pathlib import Path

          nodeids = []

          def pytest_itemcollected(item):
              nodeids.append(item.nodeid)

          def pytest_collection_finish(session):
              with Path('artifacts/ci/reference-nodeids.json').open('x') as stream:
                  json.dump(nodeids, stream, indent=2)
                  stream.write('\n')
          PYCODE
          PYTHONPATH="$PWD/artifacts/ci${PYTHONPATH:+:$PYTHONPATH}" \
            uv run --locked --no-sync python -m pytest -p collection_observer \
            --collect-only -q -n 0 --report-log artifacts/coverage/pytest-reportlog.jsonl \
            2>&1 | tee artifacts/ci/collection.log
      - name: Record final source identity even after phase failure
        if: always()
        run: |
          set -euo pipefail
          "$(uv python find 3.13.12)" - <<'PYCODE'
          import json
          from pathlib import Path
          from scripts import verify

          path = Path('artifacts/ci/source-identity.json')
          observation = json.loads(path.read_text())
          verify.collect_final_identity(observation, {name: Path(name) for name in observation['inputs']})
          if observation['after'] is not None and observation['after']['untracked'] != observation['before']['untracked']:
              observation['problems'].append('Untracked candidate inputs changed')
          path.write_text(json.dumps(observation, indent=2) + '\n')
          if observation['problems']:
              raise SystemExit('\n'.join(observation['problems']))
          PYCODE
      - name: Retain original prepare observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.identity.outputs.ci_uuid }}-prepare
          path: |
            .coverage
            .coverage.*
            artifacts/ci/
            artifacts/imagej-reader/inputs.json
            artifacts/coverage/pytest-reportlog.jsonl
            artifacts/verification/measurements.json
            artifacts/verification/imagej-interop/
            .python-version
            uv.lock
            pyproject.toml
            Makefile
            scripts/verify.py
            .github/workflows/verify.yml
          include-hidden-files: true
          overwrite: false
          if-no-files-found: error
