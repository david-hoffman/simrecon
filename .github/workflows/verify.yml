          from pathlib import Path
          from scripts import verify

          root = Path(os.environ['RUNNER_TEMP']) / 'standard-ci-inputs'
          identity_path = Path('artifacts/ci/source-identity.json')
          observation = json.loads(identity_path.read_text())
          # Every existing original root file, including unsuffixed, official empty,
          # and equal-byte files at distinct paths. No content-based deduplication.
          for stage in ['prepare', 'quality', *(f'shard-{i}' for i in range(1, 13))]:
              directory = root / stage
              for path in sorted(directory.iterdir()):
                  if path.is_file() and (path.name == '.coverage' or path.name.startswith('.coverage.')):
                      observation['inputs'][str(path)] = {'before': verify.fingerprint(path), 'after': None}
                      sys.stdout.buffer.write(os.fsencode(path) + b'\0')
          identity_path.write_text(json.dumps(observation, indent=2) + '\n')
          PYCODE
          mapfile -d '' -t native_inputs < artifacts/ci/native-inputs.paths
          if (( ${#native_inputs[@]} == 0 )); then
            echo 'No current native coverage inputs found.' >&2
            exit 1
          fi
          uv run --locked --no-sync python -W error -m coverage combine --keep "${native_inputs[@]}" \
            2>&1 | tee artifacts/ci/coverage-combine.log
      - name: Generate original official coverage JSON
        run: |
          set -euo pipefail
          make coverage-json 2>&1 | tee artifacts/ci/coverage-json.log
      - name: Generate complete official coverage HTML
        run: |
          set -euo pipefail
          make coverage-html 2>&1 | tee artifacts/ci/coverage-html.log
      - name: Report official terminal coverage under standing project policy
        run: |
          set -euo pipefail
          make coverage-report 2>&1 | tee artifacts/ci/coverage-report.log
      - name: Apply unchanged owned-file coverage validator and fail every reported problem
        run: |
          set -euo pipefail
          uv run --locked --no-sync python - <<'PYCODE'
          import json
          from pathlib import Path
          from scripts import verify

          problems = []
          try:
              record = verify.metrics(problems)
          except Exception as error:
              Path('artifacts/ci/coverage-validator-error.txt').write_text(f'{type(error).__name__}: {error}\n')
              raise
          Path('artifacts/ci/coverage-observation.json').write_text(json.dumps({'coverage': record, 'problems': problems}, indent=2) + '\n')
          if problems:
              raise SystemExit('\n'.join(problems))
          PYCODE
      - name: Build current wheel
        run: |
          set -euo pipefail
          make wheel 2>&1 | tee artifacts/ci/wheel.log
      - name: Import the current wheel in an isolated environment
        run: |
          set -euo pipefail
          make wheel-import 2>&1 | tee artifacts/ci/wheel-import.log
      - name: Audit locked dependencies
        run: |
          set -euo pipefail
          make audit 2>&1 | tee artifacts/ci/audit.log
      - name: Apply unchanged wheel validator
        run: |
          set -euo pipefail
          uv run --locked --no-sync python - <<'PYCODE'
          import json
          from pathlib import Path
          from scripts import verify

          record = verify.artifact()
          Path('artifacts/ci/wheel-observation.json').write_text(json.dumps(record, indent=2) + '\n')
          PYCODE
      - name: Recheck retained M25 digest after later phases
        if: always()
        run: |
          set -euo pipefail
          uv run --locked --no-sync python - <<'PYCODE'
          import json
          from pathlib import Path
          from scripts import verify

          record = json.loads(Path('artifacts/ci/measurement-observation.json').read_text())
          if verify.fingerprint(verify.MEASUREMENTS_PATH)['sha256'] != record['sha256']:
              raise SystemExit('Measurement evidence changed after validation')
          if verify.fingerprint(Path(record['original_path']))['sha256'] != record['sha256']:
              raise SystemExit('Original measurement export changed after validation')
          PYCODE
      - name: Record selected and resolved Java and both reader JAR byte identities
        run: |
          set -euo pipefail
          export SIMRECON_JAVA="$JAVA_HOME/bin/java"
          uv run --locked --no-sync python - <<'PYCODE'
          import json
          import os
          import subprocess
          from pathlib import Path
          from scripts import verify

          paths = [Path(os.environ['SIMRECON_JAVA']), Path('artifacts/imagej-reader/bioformats_package.jar'), Path('artifacts/imagej-reader/ij-1.54p.jar')]
          record = [{'selected': str(path.absolute()), 'resolved': str(path.resolve()), **verify.fingerprint(path)} for path in paths]
          result = subprocess.run([str(paths[0]), '-XshowSettings:properties', '-version'], text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, check=True)
          Path('artifacts/ci/java-version.log').write_text(result.stdout)
          Path('artifacts/ci/reader-byte-observations.json').write_text(json.dumps(record, indent=2) + '\n')
          PYCODE
      - name: Record final source identity even after finalizer failure
        if: always()
        run: |
          set -euo pipefail
          "$(uv python find 3.13.12)" - <<'PYCODE'
          import json
          from pathlib import Path
          from scripts import verify

          path = Path('artifacts/ci/source-identity.json')
          observation = json.loads(path.read_text())
          verify.collect_final_identity(observation, {name: Path(name) for name in observation['inputs']})
          if observation['after'] is not None and observation['after']['untracked'] != observation['before']['untracked']:
              observation['problems'].append('Untracked candidate inputs changed')
          path.write_text(json.dumps(observation, indent=2) + '\n')
          if observation['problems']:
              raise SystemExit('\n'.join(observation['problems']))
          PYCODE
      - name: Retain finalizer Java specimen and canonical reader JARs separately
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-tools-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.prepare.outputs.ci_uuid }}-finalize
          path: |
            ${{ env.JAVA_HOME }}/bin/java
            ${{ github.workspace }}/artifacts/imagej-reader/bioformats_package.jar
            ${{ github.workspace }}/artifacts/imagej-reader/ij-1.54p.jar
          include-hidden-files: true
          overwrite: false
          if-no-files-found: error
      - name: Retain finalizer native outputs and validation observations
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ needs.prepare.outputs.ci_uuid }}-finalize
          path: |
            .coverage
            .coverage.*
            artifacts/ci/
            artifacts/imagej-reader/inputs.json
            artifacts/coverage/pytest-reportlog.jsonl
            artifacts/verification/measurements.json
            artifacts/verification/imagej-interop/
            .python-version
            uv.lock
            pyproject.toml
            Makefile
            scripts/verify.py
            .github/workflows/verify.yml
            artifacts/coverage/
            dist/
          include-hidden-files: true
          overwrite: false
          if-no-files-found: error
